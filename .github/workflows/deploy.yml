# The only deploy target: test, refresh events, build, publish to GitHub Pages.
# Runs on every push to main and every morning (to pull the day's events).
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 10 * * *' # ~4-5 am in Madison
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # A failed fetch must not block the deploy: the app ignores a stale file.
      - run: npm run events
        continue-on-error: true
      # Same for the map tier: the committed copy is used if this fails.
      - run: npm run nearby
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # A separate job, as GitHub's own Pages template has it. Publishing in the
  # same job as the upload sometimes asked for the artifact before it was
  # listed, and failed a deploy whose tests and build had passed.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
