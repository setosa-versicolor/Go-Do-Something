# The weekly tagging review (tagging/PLAYBOOK.md), run by Claude Code on the
# owner's Claude plan, every Monday and on demand ("Run workflow").
#
# Two jobs, so the model never holds a token that can write to the repository:
#   review  — Claude follows the playbook and leaves its changes in the workspace.
#             Read-only access to the repository; no commits, no pushes.
#   publish — no model. Applies those changes to a fresh copy of main, checks the
#             guardrails (scripts/review-guard.ts), runs the tests and the build
#             without any credentials, then pushes a branch and opens a pull request.
#             A person merges it.
#
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`),
# and "Allow GitHub Actions to create and approve pull requests" in Settings → Actions.
# A failed run is the signal: GitHub emails the owner, and the run's summary says why.
name: Tagging review

on:
  schedule:
    - cron: '43 19 * * 1' # Mondays, 1:43 pm in Madison (12:43 pm in summer)
  workflow_dispatch:

concurrency:
  group: tagging-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare
        run: |
          echo "DATE=$(TZ=America/Chicago date +%F)" >> "$GITHUB_ENV"
          mkdir -p .review
          echo ".review/" >> .git/info/exclude
      - uses: anthropics/claude-code-action@469588f42e6b1e94cd14ad09dccfeaec772ce0fd # v1.0.280
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --disallowedTools "Bash(git push:*),Bash(git commit:*),Bash(git checkout:*),Bash(git reset:*)"
          prompt: |
            Time for this week's tagging review of this repository (the app "Do Something · Madison"). Today is ${{ env.DATE }}.

            You are running inside a GitHub Actions job. Do not commit, push, create branches or open a pull request: leave every change in the working tree. When you finish, the workflow checks the guardrails, runs npm test and npm run build, and opens the pull request itself. Dependencies are installed already.

            1. Read tagging/PLAYBOOK.md in full, including the review notes at the bottom (they say what the last review found and what to look at next), and follow it step by step: refresh the listings, read where the numbers stand, grow the answer key by about 20 hand-labelled listings (labelling before you look at what the tagger produces), find the biggest pattern in the misses, fix one to three patterns with readable rules and unit tests, measure again, make sure dev improves and holdout does not get worse, run npm test and npm run build, record the run and raise the floor, and add a dated entry under "Review notes" in the playbook. Read tagging/DESIGN.md too, for where the process is heading, but follow the playbook as it stands.

            2. If no tagging review has been merged into main yet (no dated entry after 2026-11-16 in the playbook's review notes): the first review (2026-11-16) did good work that was lost before it could be saved. Its write-up said it fixed social dances (contra, English country, folk, swing, polka, tango, salsa, ballroom) as play with move, the old folk forms also odd, with "club" and "practice" no longer dropping them as filler; Children's Museum programs that describe moving, music or science getting move, lively or learn instead of a blanket cozy; and a band in a bar carrying drink. Those are good first candidates, judged afresh against your own labels.

            3. Hold to the playbook's guardrails: never change a label or move a listing between dev and holdout to raise a score; never lower the floor to get a change through; do not loosen what is kept just to raise coverage. Change only files under tagging/, src/core/events.ts, src/cities/madison/venues.ts, and test files in tests/ other than tests/tagging.test.ts. The workflow rejects the whole review if anything else changes, a floor number falls, an answer key item is removed or changes split, or tagging/history.jsonl is rewritten rather than appended to.

            4. When done, write the pull request body to .review/PR_BODY.md (that folder is not part of the change). It gives: the before and after accuracy table for dev and holdout, the week's profile numbers that moved, each pattern you fixed in one sentence, the labels you added that you were least sure of (so a person can check them), anything you looked at and deliberately left alone, and anything that needs the owner's decision.

            If a step fails (a calendar is unreachable, tests won't pass) and you can't finish honestly, write what happened and how far you got to .review/STOPPED.md instead, and stop. Don't force a result.
      - name: Package the review
        if: always()
        run: |
          git add -A
          git diff --cached --binary > .review/changes.patch
          git diff --cached --stat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tagging-review
          path: .review/
          include-hidden-files: true
          retention-days: 30

  publish:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Installed from main's lockfile, before the review's changes are applied.
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: tagging-review
          path: ${{ runner.temp }}/review
      - name: Did the review finish?
        run: |
          R="${{ runner.temp }}/review"
          if [ -f "$R/STOPPED.md" ]; then
            { echo "## The review stopped"; echo; cat "$R/STOPPED.md"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ ! -s "$R/changes.patch" ]; then
            echo "## The review made no changes" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ ! -s "$R/PR_BODY.md" ]; then
            echo "## The review left no pull request body" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Apply the review's changes
        run: git apply --index "${{ runner.temp }}/review/changes.patch"
      - name: Check the guardrails
        run: |
          set -o pipefail
          npm run --silent review-guard -- --base ${{ github.sha }} | tee "${{ runner.temp }}/guard.md"
      - name: Test and build, without credentials
        run: |
          npm test
          npm run build
      - name: Push a branch and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(TZ=America/Chicago date +%F)
          BRANCH="tagging-review/$DATE"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then BRANCH="$BRANCH-$GITHUB_RUN_NUMBER"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -q -m "Tagging review, $DATE" -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BRANCH"
          {
            cat "${{ runner.temp }}/review/PR_BODY.md"
            echo; echo "---"; echo
            cat "${{ runner.temp }}/guard.md"
            echo; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo; echo "---"; echo "_Generated by [Claude Code](https://claude.ai/code) in the scheduled tagging review._"
          } > "${{ runner.temp }}/body.md"
          URL=$(gh pr create --base main --head "$BRANCH" --title "Tagging review, $DATE" --body-file "${{ runner.temp }}/body.md")
          echo "## Pull request opened: $URL" >> "$GITHUB_STEP_SUMMARY"
