<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="You have a free evening. Make the most of it. Three good ideas for Madison, WI, right now." />
    <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121819" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Do Something · Madison</title>
    <meta name="apple-mobile-web-app-title" content="Do Something" />
    <meta name="application-name" content="Do Something · Madison" />
    <script>
      // Apply a saved theme before first paint.
      try { var t = localStorage.getItem('gds:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Shown from the first byte until the page is ready, then faded away by the app. -->
    <div id="boot" aria-hidden="true">Do Something · Madison</div>
    <style>
      #boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; pointer-events: none;
        font: 600 0.78rem/1 system-ui, -apple-system, sans-serif; letter-spacing: 0.18em; text-transform: uppercase;
        color: rgb(27 37 40 / 0.55); background: #f4efe4; transition: opacity 0.7s ease-out; animation: boot-in 0.6s 0.3s both; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) #boot { color: rgb(236 232 222 / 0.55); background: #0f1516; } }
      :root[data-theme='dark'] #boot { color: rgb(236 232 222 / 0.55); background: #0f1516; }
      #boot.gone { opacity: 0; animation: none; }
      @keyframes boot-in { from { opacity: 0; } }
    </style>
    <div id="app"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
